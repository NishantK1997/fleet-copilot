services:
  api:
    build: .
    command: ["./scripts/start_api.sh"]
    environment:
      DATABASE_URL: sqlite:////app/data/fleet_copilot.db
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only-secret-32-bytes-min}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      LLM_MODEL: ${LLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  streamlit:
    build: .
    command: ["./scripts/start_streamlit.sh"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
